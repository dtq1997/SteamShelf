name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pyinstaller SteamShelf.spec
      - name: Zip Windows build
        run: Compress-Archive -Path dist/SteamShelf/* -DestinationPath SteamShelf_win.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: SteamShelf_win.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pyinstaller SteamShelf.spec
      - name: Zip macOS build
        run: cd dist && zip -r ../SteamShelf_mac.zip SteamShelf.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: SteamShelf_mac.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package source
        run: |
          zip -r artifacts/SteamShelf_source.zip . \
            -x '.git/*' '__pycache__/*' 'build/*' 'dist/*' \
               '.github/*' '*.pyc' '_backup/*' '_dead_code/*' \
               '_scripts/*' '_legacy_A/*' '.ruff_cache/*' \
               '.claude/*' '.DS_Store' '.dev'

      - name: Extract version and generate version.json
        id: meta
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          REPO="${{ github.repository }}"
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          M1="https://gh-proxy.com/${BASE}"
          M2="https://ghfast.top/${BASE}"
          CHANGELOG=$(git tag -l --format='%(contents:subject)' "$TAG")
          CHANGELOG_JSON=$(echo "$CHANGELOG" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")
          cat > artifacts/version.json << ENDJSON
          {
            "version": "${VER}",
            "changelog": ${CHANGELOG_JSON},
            "download_urls": {
              "win32":  ["${M1}/SteamShelf_win.zip","${M2}/SteamShelf_win.zip","${BASE}/SteamShelf_win.zip"],
              "darwin": ["${M1}/SteamShelf_mac.zip","${M2}/SteamShelf_mac.zip","${BASE}/SteamShelf_mac.zip"],
              "source": ["${M1}/SteamShelf_source.zip","${M2}/SteamShelf_source.zip","${BASE}/SteamShelf_source.zip"]
            }
          }
          ENDJSON

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "SteamShelf ${{ steps.meta.outputs.version }}" \
            --generate-notes \
            artifacts/win/SteamShelf_win.zip \
            artifacts/mac/SteamShelf_mac.zip \
            artifacts/SteamShelf_source.zip \
            artifacts/version.json
